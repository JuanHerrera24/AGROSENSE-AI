[project]
name = "agrosense-ai"
version = "2.0.0"
description = "Machine learning service for AgroSense: irrigation, soil moisture forecast, sensor faults and disease risk."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
